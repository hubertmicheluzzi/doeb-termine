name: Termine abrufen

on:
  schedule:
    - cron: "23 5,17 * * *"   # zweimal täglich, versetzt zu abruf.yml im cup-Repo
  workflow_dispatch: {}       # Knopf "Run workflow" in GitHub

permissions:
  contents: write

concurrency:
  group: abruf
  cancel-in-progress: false

jobs:
  abruf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Termine holen
        run: python3 tools/fetch_termine.py   # Python ist auf dem GitHub-Rechner schon installiert, kein API-Key nötig
      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/termine.json
          if git diff --cached --quiet; then
            echo "Keine neuen Daten."
          else
            git commit -m "Termine aktualisiert $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi

